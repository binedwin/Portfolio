<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">THING 실시간 모방 텐던 로봇 손 시스템 아키텍처</title>
  <desc id="desc">사용자 손과 카메라 입력을 Jetson의 MediaPipe가 21개 랜드마크와 7축 목표로 변환하고, ROS 2를 통해 Raspberry Pi와 7개 DYNAMIXEL 모터를 제어하며 데이터를 EC2 포털로 전달하는 구조</desc>
  <defs>
    <linearGradient id="jetson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .eyebrow { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; letter-spacing: 2.4px; fill: #2563eb; }
      .card-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .card-text { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #475569; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #1d4ed8; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
      .data-flow { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="600" fill="#ffffff"/>
  <text x="55" y="48" class="eyebrow">THING · PHYSICAL AI</text>
  <text x="55" y="83" class="title">실시간 손동작 모방 및 데이터 파이프라인</text>
  <rect x="55" y="103" width="1290" height="1" fill="#e2e8f0"/>

  <!-- Main real-time control path -->
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="205" height="190" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="290" y="155" width="265" height="190" rx="22" fill="url(#jetson)" stroke="#93c5fd"/>
    <rect x="595" y="180" width="180" height="140" rx="70" fill="#0f172a"/>
    <rect x="815" y="155" width="255" height="190" rx="22" fill="url(#control)" stroke="#a5b4fc"/>
    <rect x="1100" y="155" width="245" height="190" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <!-- Input icon -->
  <rect x="82" y="181" width="54" height="42" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <circle cx="109" cy="202" r="11" fill="none" stroke="#0284c7" stroke-width="3"/>
  <path d="M136 191 L151 184 L151 220 L136 213 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <text x="82" y="260" class="card-title">사용자 손 · RGB 카메라</text>
  <text x="82" y="288" class="card-text">실시간 손 자세 입력</text>
  <rect x="82" y="307" width="108" height="24" rx="12" fill="#eff6ff"/>
  <text x="96" y="324" class="chip">SENSING</text>

  <!-- Jetson vision -->
  <rect x="318" y="180" width="48" height="48" rx="12" fill="#2563eb"/>
  <path d="M330 204 H354 M342 192 V216 M326 188 H370 V220 H326 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="385" y="199" class="card-title">Jetson Orin Nano</text>
  <text x="385" y="223" class="card-text">Vision AI</text>
  <text x="318" y="265" class="card-text">MediaPipe · 21 Landmarks</text>
  <text x="318" y="293" class="card-text">Calibration · Filter</text>
  <rect x="318" y="307" width="150" height="24" rx="12" fill="#dbeafe"/>
  <text x="332" y="324" class="chip">21 POINTS → 7 AXES</text>

  <!-- ROS 2 bus -->
  <circle cx="685" cy="232" r="22" fill="#38bdf8" opacity="0.22"/>
  <circle cx="667" cy="250" r="9" fill="#38bdf8"/>
  <circle cx="703" cy="250" r="9" fill="#38bdf8"/>
  <circle cx="685" cy="217" r="9" fill="#38bdf8"/>
  <path d="M671 243 L680 224 M699 243 L690 224 M676 250 H694" stroke="#e0f2fe" stroke-width="3"/>
  <text x="685" y="286" text-anchor="middle" style="font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ffffff">ROS 2</text>
  <text x="685" y="307" text-anchor="middle" style="font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1">Cyclone DDS</text>

  <!-- Raspberry Pi control -->
  <rect x="843" y="180" width="48" height="48" rx="12" fill="#4f46e5"/>
  <path d="M855 192 H879 V216 H855 Z M849 198 H855 M849 210 H855 M879 198 H885 M879 210 H885" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="908" y="199" class="card-title">Raspberry Pi 5</text>
  <text x="908" y="223" class="card-text">Control · Safety</text>
  <text x="843" y="265" class="card-text">Command Manager</text>
  <text x="843" y="293" class="card-text">Guard · State Machine</text>
  <rect x="843" y="307" width="174" height="24" rx="12" fill="#e0e7ff"/>
  <text x="857" y="324" class="chip">MIMIC · MANUAL · TELEOP</text>

  <!-- Actuation -->
  <circle cx="1132" cy="203" r="23" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="1132" cy="203" r="10" fill="none" stroke="#0f766e" stroke-width="3"/>
  <path d="M1155 203 H1178" stroke="#0f766e" stroke-width="4"/>
  <text x="1194" y="199" class="card-title">XL-330 × 7</text>
  <text x="1194" y="223" class="card-text">DYNAMIXEL</text>
  <text x="1128" y="265" class="card-title">텐던 로봇 손</text>
  <text x="1128" y="293" class="card-text">7축 실시간 모방 · 파지</text>
  <rect x="1128" y="307" width="112" height="24" rx="12" fill="#ccfbf1"/>
  <text x="1142" y="324" class="chip" style="fill:#0f766e">ACTUATION</text>

  <path d="M260 250 H282" class="flow"/>
  <path d="M555 250 H584" class="flow"/>
  <path d="M775 250 H804" class="flow"/>
  <path d="M1070 250 H1090" class="flow"/>

  <!-- Data and monitoring path -->
  <text x="55" y="403" class="eyebrow" style="fill:#0f766e">MONITORING &amp; DATA</text>
  <g filter="url(#shadow)">
    <rect x="55" y="430" width="245" height="112" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="360" y="430" width="245" height="112" rx="18" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="665" y="430" width="245" height="112" rx="18" fill="#f0fdfa" stroke="#99f6e4"/>
    <rect x="970" y="430" width="375" height="112" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <text x="82" y="468" class="card-title">React 관제 웹</text>
  <text x="82" y="496" class="card-text">MJPEG · WebSocket · TELEOP</text>
  <text x="387" y="468" class="card-title">rosbag2 기록</text>
  <text x="387" y="496" class="card-text">Landmark · Command · Status</text>
  <text x="692" y="468" class="card-title">데이터 변환</text>
  <text x="692" y="496" class="card-text">학습용 JSON · CSV</text>
  <text x="997" y="468" class="card-title">AWS EC2 데이터 포털</text>
  <text x="997" y="496" class="card-text">세션 검증 · 조회 · 다운로드</text>

  <path d="M605 486 H655" class="data-flow"/>
  <path d="M910 486 H960" class="data-flow"/>
  <path d="M685 320 V398 Q685 410 673 410 H177 Q165 410 165 422" class="data-flow"/>
  <path d="M685 320 V418" class="data-flow"/>

  <text x="1345" y="575" text-anchor="end" style="font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8">REAL-TIME CONTROL · SAFE COMMAND PATH · REUSABLE DATA</text>
</svg>
